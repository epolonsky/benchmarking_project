[workspace]
authors = ["epolonsky <epolonsky@luc.edu>"]
channels = ["conda-forge", "bioconda"]
name = "benchmarking_project"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
requests = ">=2.34.2,<3"

[feature.orthologer.dependencies]
python = "3.12.*"
numpy = "<2"
scipy = "<1.13"
